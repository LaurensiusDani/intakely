limit_req_zone $server_name zone=intakely_accounts:1m rate=2r/s;
limit_req_zone $server_name zone=intakely_diary:1m rate=10r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 16k;
    limit_req_status 429;

    location = /api/health {
        proxy_pass http://pocketbase:8090;
    }

    location ~ ^/api/collections/users/(records|auth-with-password)$ {
        limit_except POST {
            deny all;
        }
        limit_req zone=intakely_accounts burst=20 nodelay;
        proxy_pass http://pocketbase:8090;
    }

    location ~ "^/api/collections/diary_entries/records(/[a-z0-9]{15})?$" {
        limit_req zone=intakely_diary burst=20 nodelay;
        proxy_pass http://pocketbase:8090;
    }

    location ~ ^/api/intakely/onboarding(/estimate)?$ {
        limit_req zone=intakely_diary burst=20 nodelay;
        proxy_pass http://pocketbase:8090;
    }

    location / {
        return 404;
    }
}
