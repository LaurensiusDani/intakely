name: intakely

services:
  pocketbase:
    image: intakely-pocketbase:latest
    pull_policy: never
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    volumes:
      - pocketbase_data:/pb/pb_data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"

  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 64m
    depends_on:
      pocketbase:
        condition: service_healthy
        restart: true
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  pocketbase_data:
